title = "DexbotX secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Known non-secret Discord snowflake used only by tests"
regexes = [
    '''^123456789012345678$''',
]

[[rules]]
id = "supabase-service-role-key"
description = "Supabase service-role or secret key assignment"
regex = '''(?i)(?:SUPABASE_(?:SERVICE_ROLE|SERVICE)_KEY|SUPABASE_SECRET_KEY)\s*[:=]\s*["']?([A-Za-z0-9._~+/=-]{20,})'''
secretGroup = 1
[[rules.allowlists]]
description = "Synthetic service key used in the API test fixture"
regexes = [
    '''^service-key-service-key-123$''',
]

[[rules]]
id = "supabase-anon-key-assignment"
description = "Supabase anonymous key assignment"
regex = '''(?i)(?:SUPABASE_ANON_KEY|NEXT_PUBLIC_SUPABASE_ANON_KEY)\s*[:=]\s*["']?([A-Za-z0-9._~+/=-]{20,})'''
secretGroup = 1

[[rules]]
id = "supabase-secret-key-format"
description = "Supabase secret key"
regex = '''sb_secret_[A-Za-z0-9_-]{16,}'''

[[rules]]
id = "redis-url-password"
description = "Redis connection URL containing a password"
regex = '''(?i)rediss?://(?:[^:/\s@]*):[^@\s/]+@[^/\s]+'''
[[rules.allowlists]]
description = "Compose URL uses the required environment variable, not a stored password"
regexes = [
    '''^redis://:\$\{REDIS_PASSWORD\}@redis:6379$''',
]

[[rules]]
id = "redis-password-assignment"
description = "Redis password assignment"
regex = '''(?i)REDIS_PASSWORD\s*[:=]\s*["']?([A-Za-z0-9][^\s"'#]{7,})'''
secretGroup = 1
[[rules.allowlists]]
description = "Historical README command generates a password; it is not a committed credential"
commits = ["77eeaafe2b31f2efb3ae188f958f4ce0a861cc2b"]
paths = [
    '''^Readme\.md$''',
]
